[project]
name = "finance-tracker"
version = "1.0.0"
description = "Personal Finance Tracker — DATA 333, Bellevue College"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.coverage.run]
source = ["finance_tracker"]
# UI event code is exercised by smoke tests; see DECISIONS.md #14.
omit = ["finance_tracker/gui_tkinter.py", "finance_tracker/dashboard.py"]

[tool.ruff.lint.per-file-ignores]
# Document builders hold long prose strings; wrapping them hurts readability.
"tools/build_*.py" = ["E501"]
